name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dkms \
            dpkg-dev \
            kmod \
            linux-headers-generic \
            sparse

      - name: Select kernel headers
        shell: bash
        run: |
          set -euo pipefail
          kdir=""
          if [ -e "/lib/modules/$(uname -r)/build" ]; then
            kdir="/lib/modules/$(uname -r)/build"
          else
            kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          fi
          if [ -z "$kdir" ] || [ ! -d "$kdir" ]; then
            echo "No usable kernel header tree found" >&2
            exit 1
          fi
          echo "KDIR=$kdir" >> "$GITHUB_ENV"
          echo "Using KDIR=$kdir"

      - name: Run test suite
        run: make test

      - name: Build Debian packages
        run: make deb

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: _build/*.deb
          if-no-files-found: error

  sgil1ctl-arm64:
    name: Build sgil1ctl for Linux arm64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            gcc-aarch64-linux-gnu

      - name: Build arm64 sgil1ctl
        run: |
          make -C tools clean
          make -C tools CC=aarch64-linux-gnu-gcc
          file tools/sgil1ctl

      - name: Package arm64 sgil1ctl artifact
        run: |
          mkdir -p dist/sgil1ctl-linux-arm64
          aarch64-linux-gnu-strip tools/sgil1ctl
          cp tools/sgil1ctl dist/sgil1ctl-linux-arm64/
          cp README.md COPYING dist/sgil1ctl-linux-arm64/
          tar -C dist -czf dist/sgil1ctl-linux-arm64.tar.gz sgil1ctl-linux-arm64

      - name: Add USB compatibility notice
        run: |
          {
            echo "## Raspberry Pi USB compatibility note"
            echo
            echo "This workflow publishes a Linux arm64 sgil1ctl build, but that does not imply that every arm64 USB host can enumerate the SGI L1."
            echo "Some Raspberry Pi USB host stacks may be incompatible with the SGI L1 controller's USB interface."
            echo "If 065e:1234 does not appear reliably in lsusb, test with another USB host or controller."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm64 sgil1ctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgil1ctl-linux-arm64
          path: dist/sgil1ctl-linux-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Release versioned package
    needs:
      - test-and-package
      - sgil1ctl-arm64
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install changelog tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Check whether Debian version changed
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(dpkg-parsechangelog -S Version)"
          before="${{ github.event.before }}"
          previous=""
          if [ -n "$before" ] &&
             [ "$before" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${before}^{commit}" 2>/dev/null &&
             git cat-file -e "${before}:debian/changelog" 2>/dev/null; then
            previous="$(git show "${before}:debian/changelog" | dpkg-parsechangelog -l- -S Version 2>/dev/null || true)"
          fi

          if [ "$current" = "$previous" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Debian version unchanged at $current"
            exit 0
          fi

          tag="v${current}"
          {
            echo "release=true"
            echo "version=$current"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          dpkg-parsechangelog -S Changes > release-notes.txt

      - name: Download package artifacts
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: dist

      - name: Download arm64 sgil1ctl artifact
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sgil1ctl-linux-arm64
          path: dist

      - name: Create or update GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.txt
          fi
