name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dkms \
            dpkg-dev \
            kmod \
            linux-headers-generic \
            sparse

      - name: Select kernel headers
        shell: bash
        run: |
          set -euo pipefail
          kdir=""
          if [ -e "/lib/modules/$(uname -r)/build" ]; then
            kdir="/lib/modules/$(uname -r)/build"
          else
            kdir="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          fi
          if [ -z "$kdir" ] || [ ! -d "$kdir" ]; then
            echo "No usable kernel header tree found" >&2
            exit 1
          fi
          echo "KDIR=$kdir" >> "$GITHUB_ENV"
          echo "Using KDIR=$kdir"

      - name: Run test suite
        run: make test

      - name: Build Debian packages
        run: make deb

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: _build/*.deb
          if-no-files-found: error

  sgil1ctl-arm64:
    name: Build sgil1ctl Debian package for arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dpkg-dev \
            file

      - name: Build arm64 sgil1ctl Debian package
        run: |
          dpkg-buildpackage -us -uc -B

      - name: Verify arm64 package
        run: |
          pkg="$(ls ../sgil1ctl_*_arm64.deb)"
          dpkg-deb -I "$pkg"
          mkdir -p /tmp/sgil1ctl-arm64
          dpkg-deb -x "$pkg" /tmp/sgil1ctl-arm64
          file /tmp/sgil1ctl-arm64/usr/bin/sgil1ctl
          mkdir -p dist
          cp "$pkg" dist/

      - name: Add USB compatibility notice
        run: |
          {
            echo "## Raspberry Pi USB compatibility note"
            echo
            echo "This workflow publishes a Linux arm64 sgil1ctl Debian package, but that does not imply that every arm64 USB host can enumerate the SGI L1."
            echo "Some Raspberry Pi USB host stacks may be incompatible with the SGI L1 controller's USB interface."
            echo "If 065e:1234 does not appear reliably in lsusb, test with another USB host or controller."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm64 sgil1ctl Debian package
        uses: actions/upload-artifact@v4
        with:
          name: sgil1ctl-arm64-deb
          path: dist/sgil1ctl_*_arm64.deb
          if-no-files-found: error

  release:
    name: Release versioned package
    needs:
      - test-and-package
      - sgil1ctl-arm64
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install changelog tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Check whether release should be published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(dpkg-parsechangelog -S Version)"
          tag="v${current}"
          before="${{ github.event.before }}"
          previous=""
          if [ -n "$before" ] &&
             [ "$before" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${before}^{commit}" 2>/dev/null &&
             git cat-file -e "${before}:debian/changelog" 2>/dev/null; then
            previous="$(git show "${before}:debian/changelog" | dpkg-parsechangelog -l- -S Version 2>/dev/null || true)"
          fi

          version_changed=true
          if [ "$current" = "$previous" ]; then
            version_changed=false
          fi

          expected_assets=(
            "sgi-l1-usb-dkms_${current}_all.deb"
            "sgil1ctl_${current}_amd64.deb"
            "sgil1ctl_${current}_arm64.deb"
          )
          release_exists=false
          missing_assets=""
          stale_notes=false
          if asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            release_exists=true
            body="$(gh release view "$tag" --json body --jq '.body')"
            for asset in "${expected_assets[@]}"; do
              if ! printf '%s\n' "$asset_names" | grep -Fxq "$asset"; then
                missing_assets="${missing_assets}${missing_assets:+, }${asset}"
              fi
            done
            if printf '%s\n' "$body" | grep -Fq "sgi-l1-usb-control (${current}) "; then
              stale_notes=true
            fi
          else
            missing_assets="release $tag does not exist"
          fi

          if [ "$version_changed" = false ] &&
             [ "$release_exists" = true ] &&
             [ -z "$missing_assets" ] &&
             [ "$stale_notes" = false ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Debian version unchanged at $current and release $tag has all expected assets and notes"
            exit 0
          fi

          {
            echo "release=true"
            echo "version=$current"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          if [ "$version_changed" = true ]; then
            echo "Debian version changed from ${previous:-<unknown>} to $current"
          elif [ "$release_exists" = false ]; then
            echo "Release $tag is missing; publishing current version"
          elif [ "$stale_notes" = true ]; then
            echo "Release $tag notes contain Debian changelog metadata; refreshing release notes"
          else
            echo "Release $tag is missing expected asset(s): $missing_assets"
          fi

          {
            printf 'Changes in %s\n\n' "$tag"
            dpkg-parsechangelog -S Changes | awk '
              seen { sub(/^  /, ""); print }
              /^\.$/ { seen = 1 }
            '
          } > release-notes.txt

      - name: Download package artifacts
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: dist

      - name: Download arm64 sgil1ctl Debian package
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sgil1ctl-arm64-deb
          path: dist

      - name: Create or update GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb --clobber
            gh release edit "$TAG" --notes-file release-notes.txt
          else
            gh release create "$TAG" dist/*.deb \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.txt
          fi
